databases:
  - name: kritikus-postgres
    databaseName: kritikus
    user: kritikus_app
    region: virginia
    plan: 0.1c-256mb
    diskSizeGB: 5
    ipAllowList: []

services:
  - type: web
    name: kritikus-web
    runtime: python
    region: virginia
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: sh start.sh
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kritikus-postgres
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.13.5
